name: Deploy

# Publishing a GitHub release deploys that tag to Cloudflare. `wrangler
# deploy` ships the Worker, its D1/R2 bindings, the Cron Trigger, and the
# custom domains in one pass, so the built artifact and the routing config
# always move together.
on:
  release:
    types: [published]
  # Manual runs use whatever ref is selected in the UI.
  workflow_dispatch:

# Never let two releases race for the same Worker. Queue instead of
# cancelling: an interrupted deploy can leave routes half-applied.
concurrency:
  group: deploy-xinchejian
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The account that owns the xinchejian.com zone, not the personal one.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs predeploy (wrangler types), astro build, then wrangler deploy.
      - run: pnpm run deploy
