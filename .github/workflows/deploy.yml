name: Deploy

# Publishing a release deploys that tag. beta goes out automatically,
# production waits for approval on the `production` GitHub environment.
on:
  release:
    types: [published]
  # Manual runs use whatever ref is selected in the UI.
  workflow_dispatch:

# Never let two deploys race for the same Worker. Queue instead of cancelling:
# an interrupted deploy can leave routes half-applied. This also serializes
# migrations, which the D1 migration lock only tolerates one at a time.
concurrency:
  group: deploy-xinchejian
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    # The Cloudflare adapter flattens the selected Wrangler environment into
    # dist/server/wrangler.json during the build, so the environment has to be
    # chosen here; `wrangler deploy --env` has nothing left to resolve against.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ENV: beta
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A build that ignored CLOUDFLARE_ENV would have flattened the top-level
      # config, and deploying that would hit production. Refuse instead.
      - name: Check the build targeted beta
        run: |
          node -e "const c=JSON.parse(require('node:fs').readFileSync('dist/server/wrangler.json','utf8'));if(c.name!=='xinchejian-beta'){console.error('Refusing to deploy: build targeted '+c.name);process.exit(1)}console.log('Deploying '+c.name)"
      # No migrate step here on purpose. Staging shares production's database,
      # so this deployment must not migrate it — beta's Worker runs with
      # EMDASH_MIGRATIONS_MODE=check and serves 503 rather than applying
      # migrations. The production job below is the only one that migrates.
      - run: pnpm exec wrangler deploy

  production:
    needs: beta
    runs-on: ubuntu-latest
    # Required reviewers on this environment hold the deploy until beta has been
    # checked at https://beta.xinchejian.com. Configure them under
    # Settings -> Environments -> production; without them this job runs straight
    # through, as it did before the environments were split.
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check the build targeted production
        run: |
          node -e "const c=JSON.parse(require('node:fs').readFileSync('dist/server/wrangler.json','utf8'));if(c.name!=='xinchejian'){console.error('Refusing to deploy: build targeted '+c.name);process.exit(1)}console.log('Deploying '+c.name)"
      # Migrate before deploying, not from the Worker's first request. Runtime
      # migrations run inside a request under EmDash's own deadline; on a fresh
      # database they exceed it, leave the lock held, and the site then serves
      # pages without CMS data. The CLI has no such deadline. This is also the
      # only place the shared database is migrated.
      - name: Inspect EmDash migrations
        run: pnpm exec emdash migrate --status --json --d1 "${{ vars.D1_DATABASE_ID }}" --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply EmDash migrations
        env:
          EMDASH_TARGET_FINGERPRINT: ${{ vars.EMDASH_TARGET_FINGERPRINT }}
        run: >-
          pnpm exec emdash migrate
          --d1 "${{ vars.D1_DATABASE_ID }}"
          --account-id "$CLOUDFLARE_ACCOUNT_ID"
          --expected-target-fingerprint "$EMDASH_TARGET_FINGERPRINT"
      - run: pnpm exec wrangler deploy
      - name: Check EmDash migrations
        run: pnpm exec emdash migrate --check --d1 "${{ vars.D1_DATABASE_ID }}" --account-id "$CLOUDFLARE_ACCOUNT_ID"
